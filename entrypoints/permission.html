<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EyeTube Control — Camera Permission</title>
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        text-align: center;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 32px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .icon {
        width: 56px;
        height: 56px;
        color: #38bdf8;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 150ms;
        min-height: 44px;
      }
      button:hover {
        background-color: #1d4ed8;
      }
      .status {
        margin-top: 16px;
        font-size: 13px;
        font-weight: 500;
      }
      .success { color: #4ade80; }
      .error { color: #f87171; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <h1>Camera Permission Required</h1>
      <p>EyeTube Control processes eye gestures 100% locally on your device. Please click <strong>Allow</strong> when prompted by Chrome.</p>
      <button id="allow-btn" type="button">Request Camera Access</button>
      <div id="status-msg" class="status"></div>
    </div>
    <script type="module" src="../src/permission/main.ts"></script>
  </body>
</html>
