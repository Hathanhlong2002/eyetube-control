<ytd-watch-flexy>
  <video class="html5-main-video"></video>
  <button class="ytp-next-button" aria-label="Next"></button>
  <like-button-view-model><button aria-pressed="false"></button></like-button-view-model>
  <ytd-subscribe-button-renderer><button></button></ytd-subscribe-button-renderer>
</ytd-watch-flexy>
<div id="secondary">
  <ytd-watch-next-secondary-results-renderer>
    <div id="related">
      <yt-lockup-view-model>
        <a class="ytLockupViewModelContentImage" href="/watch?v=first-related"></a>
        <a href="/watch?v=first-related">First related title</a>
      </yt-lockup-view-model>
      <yt-lockup-view-model>
        <a href="/watch?v=second-related">Second related title</a>
      </yt-lockup-view-model>
    </div>
  </ytd-watch-next-secondary-results-renderer>
</div>
<button id="avatar-btn"></button>
